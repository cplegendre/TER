# L1 Observed: a live event stream with the same semantics as batch analysis.
# Schema and controls: docs/ter4/requirements.md. Links to vision points are
# checked both ways against requirements/points.yaml.
level: L1
requirements:
  - id: TER-ANL-010
    pattern: ubiquitous
    text: >-
      TER shall produce an incremental session report that is identical to
      the batch report for the same event stream.
    level: L1
    source_points: [107, 108, 109]
    rationale: >-
      Live equals batch: a number shown during a session never changes when
      the session is analysed again afterwards.
    status: verified

  - id: TER-ANL-011
    pattern: event-driven
    text: >-
      When TER applies one new event to a live session, TER shall update the
      session state without reprocessing earlier events.
    level: L1
    source_points: [110]
    rationale: >-
      Incremental state keeps live analysis cheap enough to run on every
      hook.
    status: verified

  - id: TER-OBS-001
    pattern: ubiquitous
    text: >-
      TER shall accept every live and recorded observation through the
      EventIngest port as ter.event events.
    level: L1
    port: EventIngest
    source_points: [101, 102, 198]
    rationale: >-
      One ingest boundary makes live and post-hoc analysis the same
      pipeline. The wording names no contract version: the stream is at
      ter.event/0.3 and versions only add kinds (TER-OBS-011).
    status: verified

  - id: TER-OBS-002
    pattern: event-driven
    text: >-
      When Claude Code runs a PreToolUse, PostToolUse, Stop or SubagentStop
      hook, the hook adapter shall translate the hook payload into
      ter.event events.
    level: L1
    port: EventIngest
    source_points: [111, 112, 113, 114, 115, 116]
    rationale: >-
      Hooks are the live observation channel for Claude Code.
    status: verified

  - id: TER-OBS-003
    pattern: event-driven
    text: >-
      When Claude Code runs the PostToolUse hook, the hook adapter shall
      append one tool.completed event to the session event store within 50
      ms at the 95th percentile.
    level: L1
    port: EventStore
    source_points: [114, 120]
    rationale: >-
      Observation must not slow the agent down noticeably; 50 ms at p95
      keeps the hook below human-perceptible latency.
    status: verified

  - id: TER-OBS-004
    pattern: unwanted
    text: >-
      If the event store receives an event whose id it already holds, then
      the event store shall discard the duplicate without changing stored
      state.
    level: L1
    port: EventStore
    source_points: [119]
    rationale: >-
      Hooks can fire twice and replays overlap live capture; idempotent
      ingestion keeps counts exact.
    status: verified

  - id: TER-OBS-005
    pattern: event-driven
    text: >-
      When Claude Code runs the Stop hook, the hook adapter shall append one
      task.completed event whose id equals the id the session source derives
      for the same stop.
    level: L1
    port: EventIngest
    source_points: [115, 117]
    rationale: >-
      Issue #35: task completion must be observable live and correlate with
      the recorded session.
    status: planned

  - id: TER-OBS-006
    pattern: event-driven
    text: >-
      When Claude Code runs the SubagentStop hook, the hook adapter shall
      append one subagent.completed event that carries the parent session
      id.
    level: L1
    port: EventIngest
    source_points: [116]
    rationale: >-
      Issue #35: subagent activity must be attributable to its parent
      session.
    status: verified

  - id: TER-OBS-007
    pattern: ubiquitous
    text: >-
      The hook adapter shall assign each hook event the event id that the
      session source assigns to the same record.
    level: L1
    port: EventIngest
    source_points: [117, 118]
    rationale: >-
      Stable identities across live and recorded observation let the two be
      correlated and deduplicated.
    status: planned

  - id: TER-OBS-008
    pattern: state-driven
    text: >-
      While the maturity ceiling is L1 Observed, the hook adapter shall
      return an empty hook response to Claude Code.
    level: L1
    source_points: [122]
    rationale: >-
      Passive observation is the safe default; an observe-only hook cannot
      change agent behaviour.
    status: verified

  - id: TER-OBS-009
    pattern: event-driven
    text: >-
      When Claude Code runs the Stop hook, the hook adapter shall append one
      task.completed event to the session of the hook payload.
    level: L1
    port: EventIngest
    source_points: [115]
    rationale: >-
      Issue #35: the end of a task is observable live. Correlating it with
      the recorded session (TER-OBS-005) waits on real payloads.
    status: verified

  - id: TER-OBS-010
    pattern: event-driven
    text: >-
      When the hook adapter runs with a recording directory, the hook
      adapter shall write the raw hook payload and its receive time to a new
      file in that directory before it translates the payload.
    level: L1
    source_points: [115, 116, 117]
    rationale: >-
      Issue #35: the hook shapes TER relies on must come from recordings of
      real runs, not from documentation alone.
    status: verified

  - id: TER-OBS-011
    pattern: event-driven
    text: >-
      When the event log reads a record written under an earlier ter.event
      schema version, the event log shall decode the record into the same
      event.
    level: L1
    port: EventStore
    source_points: [101]
    rationale: >-
      Contract versions only add kinds, so an event log written before an
      upgrade stays readable after it.
    status: verified

  - id: TER-OBS-012
    pattern: event-driven
    text: >-
      When the hook check runs on recorded hook payloads and transcripts, TER
      shall report for each session the share of hook events whose id matches
      a session-source event, without reproducing payload content.
    level: L1
    source_points: [115, 117, 118]
    rationale: >-
      Issue #35: TER-OBS-005 and TER-OBS-007 can only be verified against real
      recordings, which stay on the owner's machine. `python -m ter hooks
      check` replays them through the live hook path and reports counts, ids,
      reasons and field names, so the result can be shared when the
      recordings cannot.
    status: verified

  - id: TER-SRC-005
    pattern: ubiquitous
    text: >-
      The session source shall map at least 99 percent of records in every
      session of the reference corpus to events.
    level: L1
    port: SessionSource
    source_points: [92]
    rationale: >-
      Issue #34: real sessions contain record types the synthetic corpus
      never produced.
    status: planned

  - id: TER-SRC-006
    pattern: event-driven
    text: >-
      When the corpus importer writes a session, the corpus importer shall
      run the redaction step before writing.
    level: L1
    source_points: [87, 95]
    rationale: >-
      Issue #34: real sessions hold secrets and paths; nothing is analysed
      or shared unredacted.
    status: verified

  - id: TER-SRC-020
    pattern: ubiquitous
    text: >-
      The redaction step shall replace every string matching a published
      secret pattern with a marker naming its kind and log the kind, record
      line and location of each replacement without its value.
    level: L1
    source_points: [95]
    rationale: >-
      Issue #34: keys, tokens, emails and addresses must not leave the
      machine, and a reviewer must be able to check what was removed.
    status: verified

  - id: TER-SRC-021
    pattern: ubiquitous
    text: >-
      The redaction step shall replace each working directory and home
      directory with a salted pseudonym that is the same in every record of
      a corpus.
    level: L1
    source_points: [95]
    rationale: >-
      Issue #34: paths name people and projects, but repeated reads of one
      file must stay recognisable after redaction.
    status: verified

  - id: TER-SRC-022
    pattern: ubiquitous
    text: >-
      The session source shall derive the same event ids, kinds and coverage
      from a redacted session as from the original session.
    level: L1
    port: SessionSource
    source_points: [87]
    rationale: >-
      Issue #34: findings on a shared corpus must cite the same evidence ids
      as a local run on the raw session.
    status: verified

  - id: TER-SRC-023
    pattern: event-driven
    text: >-
      When the corpus importer finishes an import, the corpus importer shall
      write a manifest listing every session with its record count, dates,
      coverage, redaction counts and labels.
    level: L1
    source_points: [92, 181]
    rationale: >-
      Issue #34: a corpus is reproducible and describable only if every
      session in it is listed with what was done to it.
    status: verified
