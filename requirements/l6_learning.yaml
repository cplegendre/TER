# L6 Learning: research protocols, closed loop and a second agent harness.
# Schema and controls: docs/ter4/requirements.md. Links to vision points are
# checked both ways against requirements/points.yaml.
level: L6
requirements:
  - id: TER-ANL-032
    pattern: ubiquitous
    text: >-
      The experiment runner shall assign each run to an arm from a recorded
      random seed and record the assignment before the run starts.
    level: L6
    source_points: [99, 189, 190, 200]
    rationale: >-
      Issue #45: randomised, pre-recorded assignment makes the intervention
      experiment causal.
    status: planned

  - id: TER-EXP-010
    pattern: ubiquitous
    text: >-
      The research analysis script shall reproduce every figure in the
      findings report from the recorded event and evidence data with no
      other input.
    level: L6
    source_points: [33, 182, 183, 184, 185, 187, 188, 191, 192, 193, 194, 199]
    rationale: >-
      Issues #44 and #46: every published number is reproducible by script.
    status: planned

  - id: TER-INT-020
    pattern: unwanted
    text: >-
      If a policy has 30 or more delivered interventions and no flow measure
      improves after acceptance, then TER shall mark the policy suspended
      and record the evidence.
    level: L6
    source_points: [170]
    rationale: >-
      Issue #43: interventions that do not help are removed until a human
      re-enables them.
    status: planned

  - id: TER-RSH-001
    pattern: ubiquitous
    text: >-
      TER shall produce a value stream dataset with event ids, activity
      classes, waste findings, WIP counts, context sizes, outcomes and
      interventions for each session.
    level: L6
    source_points: [33, 181, 185, 186, 187, 188]
    rationale: >-
      One dataset answers the correlation questions about WIP, context,
      exploration, repetition and quality.
    status: planned

  - id: TER-RSH-002
    pattern: ubiquitous
    text: >-
      TER shall produce a Lean waste study dataset that links each detector
      finding to the measured inefficiency of its session.
    level: L6
    source_points: [182, 183, 184]
    rationale: >-
      Tests whether classical Lean wastes predict inefficiency and which
      need adapting.
    status: planned

  - id: TER-RSH-003
    pattern: ubiquitous
    text: >-
      TER shall produce a controlled experiment dataset that compares
      sessions with evidence-based interventions, fixed-budget controls and
      no intervention.
    level: L6
    source_points: [189, 190, 194, 199, 200]
    rationale: >-
      Answers the central question: do real-time Lean interventions make
      agentic development measurably better.
    status: planned

  - id: TER-RSH-004
    pattern: ubiquitous
    text: >-
      TER shall produce an expert-labelled session dataset with the static
      analysis results for the same sessions.
    level: L6
    source_points: [193]
    rationale: >-
      The second study evaluates static TER analysis against expert labels.
    status: planned

  - id: TER-RSH-005
    pattern: ubiquitous
    text: >-
      TER shall publish, with each paper, the Lean model definition and the
      TER version used as its reference implementation.
    level: L6
    source_points: [191, 192]
    rationale: >-
      TER is the reference implementation and instrument for the published
      model.
    status: planned

  - id: TER-SRC-010
    pattern: optional
    text: >-
      Where a second agent harness adapter is installed, TER shall read the
      sessions of that harness into event streams that pass the session
      source contract suite.
    level: L6
    port: SessionSource
    source_points: [103]
    rationale: >-
      The event contract is proven provider-neutral only when a second
      harness passes the same contract tests as Claude Code. Issue #55: a
      real recorded GARE run (tests/fixtures/gare/runs/c2ffdf8f1b09, a local
      Ollama model) passes the suite; it has no failover, so route.failover
      from a real provider is still covered by mock data only.
    status: verified

  - id: TER-SRC-011
    pattern: ubiquitous
    text: >-
      The GARE session source shall translate the gare.ter.usage.v2 rows and
      the run events that GARE exports for one run into ter.event events
      whose token totals equal the export's totals.
    level: L6
    port: SessionSource
    source_points: [103]
    rationale: >-
      Issue #52: tokens per verified outcome needs GARE's tokens, routes,
      attempts and outcomes in the same stream as Claude Code sessions.
    status: verified

  - id: TER-SRC-012
    pattern: unwanted
    text: >-
      If the GARE session source reads a row of an unsupported schema or a
      run event of an unknown state, then the session source shall count it
      in the trace coverage by schema name or state.
    level: L6
    port: SessionSource
    source_points: [103]
    rationale: >-
      Issue #52: GARE's export will change; drift must lower coverage, not
      vanish.
    status: verified

  - id: TER-SRC-013
    pattern: ubiquitous
    text: >-
      The GARE session source shall report cache creation and cache read
      tokens as zero and mark every trace with the no-cache-tokens usage
      limit.
    level: L6
    port: SessionSource
    source_points: [105]
    rationale: >-
      Issue #52: GARE records input and output tokens only, so cache
      figures from it are unknown rather than zero.
    status: verified

  - id: TER-SRC-014
    pattern: state-driven
    text: >-
      While a trace carries a usage limit, the observe report shall state
      that limit beside its token figures.
    level: L6
    source_points: [105]
    rationale: >-
      Issue #52: a reader comparing GARE and Claude Code token figures must
      see which ones cannot include cache tokens.
    status: verified

  - id: TER-SRC-016
    pattern: state-driven
    text: >-
      While a trace carries the no-response-text usage limit, every TER
      report of that trace shall state that limit.
    level: L6
    source_points: [105]
    rationale: >-
      PR #60 review: GARE exports usage counts, not responses, so token counts
      taken from event text measure route labels; the reader must know.
    status: verified

  - id: TER-SRC-017
    pattern: unwanted
    text: >-
      If explain or a3 is asked for a TER score of a session that is not
      Claude Code JSONL, then TER shall report the session without a TER
      score and say why.
    level: L6
    source_points: [103]
    rationale: >-
      PR #60 review: TER 3 reads Claude Code JSONL only; a3 scored GARE runs
      by default and crashed on a folder or scored a usage export as a
      transcript.
    status: verified

  - id: TER-STK-010
    pattern: ubiquitous
    text: >-
      The stack comparison shall report, for each stratum of dominant
      language or repository stack by task category label and outcome label,
      the stratum's session count and the median generated tokens, context
      tokens, flow efficiency, unused context share and rework, regeneration
      and exploration rates of its sessions.
    level: L6
    source_points: [182, 185]
    rationale: >-
      Leigh's request: compare token use and waste across languages and
      stacks. Task type, size and outcome confound a raw comparison, so
      sessions are compared only within one task category and outcome.
      Proving the tool needs synthetic data only; the finding needs a real
      corpus with several stacks (the points stay open).
    status: verified

  - id: TER-STK-011
    pattern: unwanted
    text: >-
      If a stratum holds fewer sessions than the stated minimum, then the
      stack comparison shall mark the stratum insufficient and report no
      measure and no comparison for it.
    level: L6
    source_points: [182, 185]
    rationale: >-
      A median of two sessions is an anecdote; the default minimum is five.
    status: verified
