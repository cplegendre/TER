<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 174" width="720" height="174" role="img" class="ter-chart-svg" aria-labelledby="span-timeline-title span-timeline-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
