<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" width="1160" height="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The agentic value stream</title>
  <desc>Six stages from developer intent to the agent's response: intent, explore, plan, implement, validate, respond. A failing validation loops back to implement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <g font-size="22" text-anchor="middle">
    <!-- Intent -->
    <rect x="10" y="60" width="150" height="110" rx="55" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
    <text x="85" y="108" font-weight="700" fill="#0b0b0b">Intent</text>
    <text x="85" y="138" font-size="16" fill="#52514e">developer prompt</text>
    <!-- Explore -->
    <rect x="200" y="60" width="150" height="110" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
    <text x="275" y="108" font-weight="700" fill="#0b0b0b">Explore</text>
    <text x="275" y="138" font-size="16" fill="#52514e">read · search</text>
    <!-- Plan -->
    <rect x="390" y="60" width="150" height="110" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
    <text x="465" y="108" font-weight="700" fill="#0b0b0b">Plan</text>
    <text x="465" y="138" font-size="16" fill="#52514e">reasoning · to-do</text>
    <!-- Implement -->
    <rect x="580" y="60" width="150" height="110" rx="10" fill="#e3f5ee" stroke="#1baf7a" stroke-width="2"/>
    <text x="655" y="108" font-weight="700" fill="#0b0b0b">Implement</text>
    <text x="655" y="138" font-size="16" fill="#52514e">edit · write</text>
    <!-- Validate -->
    <rect x="770" y="60" width="150" height="110" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
    <text x="845" y="108" font-weight="700" fill="#0b0b0b">Validate</text>
    <text x="845" y="138" font-size="16" fill="#52514e">tests · lint · types</text>
    <!-- Respond -->
    <rect x="960" y="60" width="190" height="110" rx="55" fill="#e3f5ee" stroke="#1baf7a" stroke-width="2"/>
    <text x="1055" y="108" font-weight="700" fill="#0b0b0b">Respond</text>
    <text x="1055" y="138" font-size="16" fill="#52514e">final answer</text>
  </g>
  <g stroke="#52514e" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="115" x2="196" y2="115"/>
    <line x1="350" y1="115" x2="386" y2="115"/>
    <line x1="540" y1="115" x2="576" y2="115"/>
    <line x1="730" y1="115" x2="766" y2="115"/>
    <line x1="920" y1="115" x2="956" y2="115"/>
    <path d="M845,170 C845,235 655,235 655,174"/>
  </g>
  <text x="750" y="250" font-size="17" text-anchor="middle" fill="#52514e">fail → fix: iteration if the failure moves, rework if it repeats</text>
  <g font-size="15" fill="#52514e">
    <rect x="200" y="20" width="14" height="14" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
    <text x="222" y="32">necessary, non-value-adding by default</text>
    <rect x="560" y="20" width="14" height="14" fill="#e3f5ee" stroke="#1baf7a" stroke-width="2"/>
    <text x="582" y="32">value-adding by default</text>
  </g>
  <text x="580" y="290" font-size="15" text-anchor="middle" fill="#6f6d68">Stages come from tool kinds in the ter.event contract (fs.read, fs.edit, exec.shell, agent.handoff), never from harness tool names.</text>
</svg>
